name: jlpt_mock_test
description: "Thi thử JLPT N5 — đề chuẩn cấu trúc, chấm điểm, giải thích tiếng Việt."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  flutter_tts: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/exams/n5/
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans_400Regular.ttf
        - asset: assets/fonts/PlusJakartaSans_500Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans_700Bold.ttf
          weight: 700
